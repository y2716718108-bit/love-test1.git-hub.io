,{"label":"会主动回顾细节，还借此发起下一次互动","score":3}]},{"id":"female-aries-i05","gender":"female","zodiac":"aries","dimension":"initiative","weight":4,"text":"除了请你帮忙或共同事务，最近你们交流一件刚发生的有趣小事的联系由对方发起过多少次？","options":[{"label":"对方找我基本都是有事要帮忙","score":0},{"label":"只有一次不涉及事务的主动联系","score":1},{"label":"有几次单纯想交流近况的主动联系","score":2},{"label":"经常有不带请求的联系，也愿意延续双向交流","score":3}]},{"id":"female-aries-i06","gender":"female","zodiac":"aries","dimension":"initiative","weight":3,"text":"你们商量一起尝试一个简单的新活动时，对方在提出可行建议这件事上有多少主动性？","options":[{"label":"一直由我提出，对方没有参与安排","score":0},{"label":"我给出完整方案后，对方才说可以或不可以","score":1},{"label":"对方会主动补充一个可行时间或选择","score":2},{"label":"对方多次主动提出具体方案，也询问我是否方便","score":3}]},{"id":"female-aries-i07","gender":"female","zodiac":"aries","dimension":"initiative","weight":3,"text":"你们遇到临时安排突然增多的日子、联系自然减少时，对方之后会主动恢复联系吗？不需要故意失联测试。","options":[{"label":"自然中断后，一直只有我重新联系","score":0},{"label":"我恢复联系后，对方才简短接话","score":1},{"label":"对方主动恢复过联系，并询问我的近况","score":2},{"label":"对方不止一次主动恢复联系，也说明自己可交流的时间","score":3}]},{"id":"female-aries-i08","gender":"female","zodiac":"aries","dimension":"initiative","weight":2,"text":"你们和朋友一起参加轻松的活动时，对方会不会主动创造与你直接交流的机会？","options":[{"label":"有自然机会也很少主动跟我交流","score":0},{"label":"主要因为座位、分工或礼貌才跟我说话","score":1},{"label":"会主动问我想法，或接我提起的话题","score":2},{"label":"会不止一次主动与我交流，散场后也愿意继续联系","score":3}]},{"id":"female-aries-t01","gender":"female","zodiac":"aries","dimension":"time","weight":4,"text":"当你们商量一起尝试一个简单的新活动，对方对时间、地点等具体事项通常如何回应？","options":[{"label":"反复说以后再说，没有可落实的安排","score":0},{"label":"表示可以，但细节一直由我追着确认","score":1},{"label":"会一起确认一个时间或地点","score":2},{"label":"会主动确认细节，并按约定推进安排","score":3}]},{"id":"female-aries-t02","gender":"female","zodiac":"aries","dimension":"time","weight":4,"text":"最近4周，你们商量一起尝试一个简单的新活动并约好以后，对方的实际履约情况怎样？","options":[{"label":"多次没有兑现，也没有解释或补救","score":0},{"label":"偶尔兑现，但常需要我反复确认","score":1},{"label":"多数能兑现，变化时会及时说明","score":2},{"label":"多次可靠地兑现，遇到变化也主动协商补救","score":3}]},{"id":"female-aries-t03","gender":"female","zodiac":"aries","dimension function editorView(){const editor=state.editor,draft=editor.draft,question=editorQuestion(),sum=draft.dimensions.reduce((total,item)=>total+Number(item.weight||0),0),optionsFor=(items,current)=>items.map(([value,label])=>`<option value="${esc(value)}" ${current===value?'selected':''}>${esc(label)}</option>`).join('');return `<main class="editor-page container"><div class="editor-header"><div><div class="eyebrow">YOUR LOCAL QUESTION LIBRARY</div><h1>店主题库编辑</h1><p class="editor-notice">已通过本次密码验证。修改完整 24 套题库后，点击“导出测试 HTML（带密码）”更新顾客文件；导出时编辑器会重新锁定。保存只影响本机，不会自动更新已发出的旧文件。</p></div><button class="secondary" data-action="exit-editor">锁定并返回测试 ↗</button></div><div class="editor-toolbar"><button class="primary" data-action="save-config">验证并保存到本机</button><button class="secondary" data-action="export-html">导出测试 HTML（带密码） ↓</button><button class="secondary" data-action="export-config">导出题库 JSON ↓</button><button class="secondary" data-action="import-config">导入题库 JSON ↑</button><button class="secondary" data-action="feedback-library">查看本机反馈（${records.length}）</button><input id="config-file" class="visually-hidden" type="file" accept=".json,application/json" tabindex="-1" aria-label="导入题库 JSON"></div><div id="editor-status" class="status-message ${editor.statusError?'error-message':''}" role="status">${esc(editor.status||'')}</div><p class="draft-status" id="draft-status">${editor.dirty?'有尚未保存的修改。':'本机题库第 '+config.version+' 版 · 所有更改已保存。'}${run?' 已开始的答题继续使用第 '+run.revision+' 版快照。':''}</p><div class="editor-grid"><aside class="editor-side"><h2>题库与评分设置</h2><label class="form-field"><span>测试标题（1–80 字）</span><input data-edit="title" maxlength="80" value="${esc(draft.title)}"></label><label class="form-field"><span>测试介绍（1–1000 字）</span><textarea data-edit="intro" maxlength="1000" rows="4">${esc(draft.intro)}</textarea></label><div class="separator"></div><h2>维度权重</h2>${draft.dimensions.map((item,index)=>`<label class="dimension-editor"><span>${esc(item.label)}</span><input type="number" min="0.1" max="${item.id==='style'?10:100}" step="0.1" data-edit="dimension-weight" data-index="${index}" value="${item.weight}" aria-label="${esc(item.label)}权重"></label>`).join('')}<p class="dimensions-total" id="weight-total">当前合计：${sum.toFixed(1)}% / 100%</p><p class="editor-help">六维度之和必须为 100%；星座互动风格 ≤ 10%。题内四个选项分别为 0、1、2、3 分。性别与星座本身不加分。</p><div class="separator"></div><button class="text-button" data-action="restore-default">恢复文件内置题库</button></aside><section class="editor-main"><h2>编辑具体问题</h2><div class="form-row"><label class="form-field"><span>本人性别</span><select data-editor-route="gender">${optionsFor(genders.map(item=>[item.id,item.name]),editor.gender)}</select></label><label class="form-field"><span>对方星座</span><select data-editor-route="zodiac">${optionsFor(signs.map(item=>[item.id,item.name]),editor.zodiac)}</select></label></div><p class="editor-help">${esc(genderName(editor.gender))} × ${esc(signById(editor.zodiac).name)} · 独立 50 题 · 点击序号切换</p><div class="question-selector" aria-label="选择编辑的题目">${Array.from({length:50},(_,index)=>`<button class="${index===editor.position?'selected':''}" data-action="editor-question" data-value="${index}" aria-label="编辑第 ${index+1} 题" aria-pressed="${index===editor.position}">${String(index+1).padStart(2,'0')}</button>`).join('')}</div><div class="question-eyebrow">QUESTION ${String(editor.position+1).padStart(2,'0')}<span>${esc(question.id)}</span></div><label class="form-field" style="margin-top:15px"><span>题干（1–600 字）</span><textarea data-edit="question-text" maxlength="600" rows="3">${esc(question.text)}</textarea></label><div class="form-row"><label class="form-field"><span>观察维度</span><select data-edit="question-dimension">${optionsFor(draft.dimensions.map(item=>[item.id,item.label]),question.dimension)}</select></label><label class="form-field"><span>题目权重（1–4）</span><input data-edit="question-weight" type="number" min="1" max="4" step="1" value="${question.weight}"></label></div>${question.options.map((option,index)=>`<div class="option-edit"><h3>选项 ${'ABCD'[index]}</h3><label class="form-field"><span>选项文字（1–300 字）</span><textarea data-edit="option-label" data-index="${index}" maxlength="300" rows="2">${esc(option.label)}</textarea></label><div class="form-row"><label class="form-field"><span>分值</span><select data-edit="option-score" data-index="${index}">${optionsFor([0,1,2,3].map(value=>[String(value),String(value)]),String(option.score))}</select></label><label class="form-field"><span>优先提醒标记</span><select data-edit="option-flag" data-index="${index}">${optionsFor([['','无提醒'],['rejection','明确拒绝'],['boundary','边界问题']],option.flag||'')}</select></label></div></div>`).join('')}<p class="editor-help">“明确拒绝”与“边界问题”会优先决定结果建议，积极分数不能抵消。每套需保留五个核心维度各 8 题，互动风格 10 题。</p><div class="editor-actions"><button class="secondary" data-action="editor-prev" ${editor.position===0?'disabled':''}>← 上一题</button><button class="secondary" data-action="editor-next" ${editor.position===49?'disabled':''}>下一题 →</button></div></section></div></main>`}
function render(focusQuestion=false){if(state.view==='editor'&&!window.XinjiAdmin?.isUnlocked()){state.editor=null;state.view=run?run.stage:'home'}theme();const view=state.view==='profile'?profileView():state.view==='quiz'?quizView():state.view==='result'?resultView():state.view==='editor'?editorView():homeView();app.innerHTML=header()+warning()+view+footer();if(focusQuestion)requestAnimationFrame(()=>{const heading=document.getElementById('question-title');heading?.focus({preventScroll:true});heading?.scrollIntoView({block:'nearest',behavior:'auto'})})}
function navigate(view){state.view=view;render();window.scrollTo({top:0,behavior:'auto'})}
function toast(message){clearTimeout(toastTimer);app.querySelector('.toast')?.remove();const element=document.createElement('div');element.className='toast';element.setAttribute('role','status');element.textContent=message;app.append(element);toastTimer=setTimeout(()=>element.remove(),6500)}
function download(name,text,type){const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.hidden=true;app.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function removeRun(){run=null;removeStore('run');removeStore('snapshot')}
function beginProfile(){state.gender='female';state.zodiac='';state.consent=false;navigate('profile')}
function restart(){if(run)showDialog('restart');else beginProfile()}
function answer(value){if(!run||state.view!=='quiz')return;run.answers[questions()[run.position].id]=value;saveRun();render();const selected=app.querySelector(value===null?'[data-action="unknown"]':`[data-action="answer"][data-value="${value}"]`);selected?.focus({preventScroll:true})}
function next(){const items=questions();if(!run||!has(run.answers,items[run.position].id))return;if(run.position===49){run.stage='result';run.feedbackState='form';run.feedbackId=null;run.feedbackRecord=null;saveRun();navigate('result')}else{run.position++;saveRun();render(true)}}
function openEditor(){if(!window.XinjiAdmin?.isUnlocked())return;if(state.view==='editor')return;state.editor={draft:clone(config),gender:'female',zodiac:'aries',position:0,dirty:false,status:'',statusError:false,returnView:state.view};navigate('editor')}
function editorStatus(message,error=false){const editor=state.editor;editor.status=message;editor.statusError=error;const node=document.getElementById('editor-status');if(node){node.textContent=message;node.classList.toggle('error-message',error)}}
function markDirty(){state.editor.dirty=true;const node=document.getElementById('draft-status');if(node)node.textContent='有尚未保存的修改。'+(run?' 已开始的答题继续使用第 '+run.revision+' 版快照。':'')}
function validateDraft(){if(!window.XinjiAdmin?.isUnlocked()||!state.editor)return null;const draft=state.editor.draft;if(new Blob([JSON.stringify(draft)]).size>LIMIT){editorStatus('题库数据超过 1.9 MB，请缩短文字后再保存。',true);return null}const validation=checked(draft);if(!validation.success){editorStatus('尚未保存，请修正：\n'+validation.errors.join('\n'),true);document.getElementById('editor-status')?.scrollIntoView({block:'center'});return null}return validation.data}
function saveConfig(){const valid=validateDraft();if(!valid)return;if(state.editor.dirty)valid.version=Math.max(config.version,valid.version)+1;config=valid;const saved=store('config',config);state.editor.draft=clone(config);state.editor.dirty=false;state.editor.status=saved?'已通过整库校验并保存到本机。新一轮测试使用第 '+config.version+' 版；其他人的文件不会自动更新。':'整库校验通过，当前页面已使用新题库，但浏览器未能持久保存。请立即导出编辑后的 HTML。';state.editor.statusError=!saved;render()}
function editedForExport(){const valid=validateDraft();if(!valid)return null;if(state.editor.dirty)valid.version=Math.max(config.version,valid.version)+1;return valid}
function exportReport(){if(!run)return;const report=result();const content=[run.config.title+' · 关系观察报告','生成时间：'+new Date().toLocaleString('zh-CN'),'题库版本：'+run.revision+' · '+genderName(run.gender)+' × '+signById(run.zodiac).name,'好感信号指数：'+(report.index===null?'线索不足，不输出明确总分':report.rawScore.toFixed(1)+' / 100'),'有效线索覆盖：'+Math.round(report.coverage*100)+'%（不是置信度）',report.coverage<1?'缺失信息范围：'+report.lower.toFixed(1)+'–'+report.upper.toFixed(1)+' 分（不是统计置信区间）':'',report.headline,report.summary,'互动维度：',...report.dimensions.map(item=>item.label+'：'+(item.score===null||item.insufficient?'线索不足':item.score.toFixed(1)+' / 100')+'；观察覆盖 '+Math.round(item.coverage*100)+'%'),'建议：',...report.advice.map((item,index)=>(index+1)+'. '+item),'本报告是行为信号整理，不代表真实喜欢概率。题目和权重未经样本校准。星座仅用于娱乐情景设计，不是人格判断依据。明确拒绝或边界问题始终优先于分数。'].filter(Boolean).join('\n\n');download('心迹-我的关系观察报告.txt',content)}
function saveFeedback(){if(!run||![0,20,40,60,80,100].includes(run.feedbackRating))return;const report=result(),record={schemaVersion:1,id:run.feedbackId||makeId(),createdAt:new Date().toISOString(),source:'offline-html',gender:run.gender,zodiac:run.zodiac,configRevision:run.revision,index:report.index===null?null:Math.round(report.rawScore*10)/10,coverage:report.coverage,rating:run.feedbackRating,text:run.feedbackText.trim().slice(0,2000)};records=[...records.filter(item=>item.id!==record.id),record].slice(-200);const saved=store('feedback',records);run.feedbackId=record.id;run.feedbackRecord=record;run.feedbackState='saved';saveRun();render();if(!saved)toast('反馈已保留在当前页面，但未能写入浏览器存储。请现在下载这条反馈。')}
function methodBody(){const activeConfig=run&&['quiz','result'].includes(state.view)?run.config:config;return `<div class="eyebrow">HOW IT WORKS</div><h2 id="dialog-title">认真看待每一条线索。</h2><h3>单文件版可以做什么？</h3><p>直接打开这个 HTML，即可离线答题、查看报告、编辑完整题库。数据只保存在当前浏览器；换手机、换浏览器或清除数据后不会同步。文件中的题库内容对持有文件的人可见。</p><h3>48 小时限制与反馈回收</h3><p><b>纯 HTML 没有服务端，不能可靠限制 48 小时后失效，也不能自动把反馈发送给店主。</b>修改本机时间、清除数据或复制文件都能绕过本地限制，因此本版不设置假倒计时。正式售卖请使用已有服务器版，由服务器校验专属链接，首次打开后 48 小时失效，并集中收集反馈。</p><h3>编辑后怎样分享？</h3><p>“保存到本机”只保留在你的浏览器，已开始的答题使用原题库快照。要分享更新，请选择“导出顾客测试版 HTML”；这份顾客文件不含题库编辑器。请把“店主编辑版”留给自己保管。导出文件仅包含题库，不包含你的答案和反馈；其他人的旧文件不会自动更新。</p><h3>0–100 分是怎么来的？</h3><p>每题四个行为选项分别为 0–3 分，题目权重为 1–4。先按题目权重计算各维度得分，再按以下比例合成。性别与星座本身不加减分。</p><div class="weight-grid">${activeConfig.dimensions.map(item=>`<div><span>${esc(item.label)}</span><b>${item.weight}%</b></div>`).join('')}</div><p>“不了解”不计入已知答案的平均分，同时降低观察覆盖率。覆盖不足 60% 时，不输出明确分数，而是展示缺失信息范围。明确拒绝和边界问题始终优先决定建议。</p><h3>星座与准确度</h3><p>24 套是主题不同、测量维度相同的独立题库。太阳星座不能可靠推断人格或关系结果，星座与幸运色只作为娱乐性设计。关系研究启发了观察维度，但本产品的题目、权重和准确率尚未经样本校准。反馈百分比只是用户主观贴近程度，不是科学验证。</p><h3>数据与隐私</h3><p>本文件不请求网络资源，不收集姓名、电话或生日。答案、题库和反馈保存在本机浏览器存储中；同一浏览器使用者可看到本机数据。本机反馈最多保留最近 200 条，请及时下载备份。下载反馈只包含主题、题库版本、总分概况、贴近程度和你填写的文字，不含逐题答案。</p><button class="primary wide" data-action="close-dialog">我知道了 ✓</button>`}
function feedbackLibraryBody(){return `<div class="eyebrow">LOCAL FEEDBACK ONLY</div><h2 id="dialog-title">本机反馈记录</h2><p>这里只显示当前浏览器保存的反馈，不会收集其他手机或其他 HTML 文件的记录。最多保留最近 200 条；请自行下载备份。</p>${records.length?`<button class="primary" data-action="export-feedback-all">下载本机全部反馈 JSON ↓</button><div class="feedback-records">${[...records].reverse().map(record=>`<div class="feedback-record"><div class="feedback-record-head"><b>贴近程度 ${record.rating}% · 第 ${esc(record.configRevision)} 版</b><span>${esc(dateText(record.createdAt))}</span></div><p>${esc(genderName(record.gender))} × ${esc(signById(record.zodiac)?.name||record.zodiac)} · ${record.index===null?'线索不足':esc(record.index)+' / 100'}</p>${record.text?`<p>${esc(record.text)}</p>`:'<p>未填写文字反馈</p>'}</div>`).join('')}</div>`:'<div class="empty-small">暂时没有本机反馈。完成一份测试后可保存反馈。</div>'}<button class="secondary wide" style="margin-top:20px" data-action="close-dialog">返回编辑器</button>`}
function showDialog(kind){app.querySelector('dialog')?.remove();const previousFocus=document.activeElement,dialog=document.createElement('dialog');dialog.className='modal';dialog.setAttribute('aria-labelledby','dialog-title');let body='';if(kind==='method')body=methodBody();if(kind==='feedback-library')body=feedbackLibraryBody();if(kind==='restart')body='<div class="eyebrow">A NEW LITTLE STORY</div><h2 id="dialog-title">开始新的测试？</h2><p>这会清除本次答题进度与当前报告。已保存的反馈会保留，你也可以先返回下载报告。</p><div class="button-row"><button class="primary" data-action="confirm-restart">确认，开始新的测试</button><button class="secondary" data-action="close-dialog">保留当前进度</button></div>';if(kind==='exit-editor')body='<h2 id="dialog-title">还有未保存的题库修改</h2><p>继续编辑并保存，或放弃本次草稿。已开始的答题不会受影响。</p><div class="button-row"><button class="primary" data-action="close-dialog">继续编辑</button><button class="secondary" data-action="discard-editor">放弃草稿并返回</button></div>';if(kind==='restore-default')body='<h2 id="dialog-title">恢复此文件内置题库？</h2><p>当前编辑草稿将被替换。恢复后仍需点击“验证并保存到本机”才会应用；已开始的答题保留原题库快照。</p><div class="button-row"><button class="primary" data-action="confirm-restore">恢复为内置题库</button><button class="secondary" data-action="close-dialog">取消</button></div>';dialog.innerHTML='<button class="modal-close" data-action="close-dialog" aria-label="关闭对话框">×</button>'+body;app.append(dialog);dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)dialog.close()}});dialog.addEventListener('close',()=>{dialog.remove();if(previousFocus&&previousFocus.isConnected)previousFocus.focus({preventScroll:true})});dialog.showModal()}
function closeDialog(){app.querySelector('dialog')?.close()}
app.addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action,value=button.dataset.value;
if(['editor','exit-editor','discard-editor','save-config','export-config','export-html','export-owner','import-config','restore-default','confirm-restore','editor-question','editor-prev','editor-next','feedback-library','export-feedback-all'].includes(action)&&!window.XinjiAdmin?.isUnlocked()){window.XinjiAdmin?.request();return}
if(action==='close-dialog'){closeDialog();return}
if(action==='method')return;
if(action==='home'){if(state.view==='editor'){if(state.editor.dirty){state.editor.returnView='home';showDialog('exit-editor')}else{state.editor.returnView='home';window.XinjiAdmin.lock()}}else navigate('home');return}
if(action==='start'||action==='restart'){restart();return}

if(action==='gender'){state.gender=value;render();app.querySelector(`[data-action="gender"][data-value="${value}"]`)?.focus({preventScroll:true});return}

if(action==='enter-quiz'){if(!state.zodiac||!state.consent)return;run={config:clone(config),gender:state.gender,zodiac:state.zodiac,answers:{},position:0,stage:'quiz',revision:config.version,id:makeId(),feedbackRating:null,feedbackText:'',feedbackState:'form',feedbackId:null,feedbackRecord:null};saveRun(true);navigate('quiz');return}
if(action==='answer'){answer(Number(value));return}
if(action==='unknown'){answer(null);return}
if(action==='next'){next();return}
if(action==='prev'){if(run&&run.position>0){run.position--;saveRun();render(true)}return}
if(action==='rating'){run.feedbackRating=Number(value);saveRun();render();app.querySelector(`[data-action="rating"][data-value="${value}"]`)?.focus({preventScroll:true});return}
if(action==='feedback-submit'){saveFeedback();return}
if(action==='feedback-skip'){run.feedbackState='skipped';saveRun();render();return}
if(action==='feedback-edit'){run.feedbackState='form';saveRun();render();return}
if(action==='download-feedback'){if(run.feedbackRecord)download('心迹-反馈-'+run.feedbackRecord.id+'.json',JSON.stringify(run.feedbackRecord,null,2),'application/json;charset=utf-8');return}
if(action==='export-feedback-all'){download('心迹-本机反馈.json',JSON.stringify({exportedAt:new Date().toISOString(),source:'offline-html',feedback:records},null,2),'application/json;charset=utf-8');return}

if(action==='save-config'){saveConfig();return}
if(action==='export-config'){const valid=editedForExport();if(valid){download('心迹-完整题库-第'+valid.version+'版.json',JSON.stringify(valid,null,2),'application/json;charset=utf-8');toast('已导出通过校验的完整题库。')}return}
if(action==='export-html'||action==='export-owner'){const valid=editedForExport();if(valid){try{await window.exportCurrentHtml(valid);toast('已导出带密码的新测试文件；隐藏编辑器已锁定，不包含你的答案或反馈。')}catch(_){editorStatus('HTML 导出未完成，请允许浏览器下载后重试。',true)}}return}
if(action==='import-config'){document.getElementById('config-file').click();return}
if(action==='restore-default'){showDialog('restore-default');return}
if(action==='confirm-restore'){closeDialog();state.editor.draft=clone(baseConfig);state.editor.position=0;state.editor.dirty=true;state.editor.status='已恢复内置题库到编辑草稿。请验证并保存后应用。';state.editor.statusError=false;render();return}
if(action==='editor-question'){state.editor.position=Number(value);render();return}
if(action==='editor-prev'||action==='editor-next'){state.editor.position=Math.max(0,Math.min(49,state.editor.position+(action==='editor-prev'?-1:1)));render();return}
if(action==='feedback-library')showDialog('feedback-library');
});
function handleEditorInput(target){if(!window.XinjiAdmin?.isUnlocked())return;if(state.view!=='editor'||!target.dataset.edit)return;const editor=state.editor,question=editorQuestion(),index=Number(target.dataset.index),value=target.value;switch(target.dataset.edit){case'title':editor.draft.title=value;break;case'intro':editor.draft.intro=value;break;case'dimension-weight':editor.draft.dimensions[index].weight=value===''?NaN:Number(value);document.getElementById('weight-total').textContent='当前合计：'+editor.draft.dimensions.reduce((sum,item)=>sum+Number(item.weight||0),0).toFixed(1)+'% / 100%';break;case'question-text':question.text=value;break;case'question-dimension':question.dimension=value;break;case'question-weight':question.weight=value===''?NaN:Number(value);break;case'option-label':question.options[index].label=value;break;case'option-score':question.options[index].score=Number(value);break;case'option-flag':if(value)question.options[index].flag=value;else delete question.options[index].flag;break;default:return}markDirty()}
app.addEventListener('input',event=>{const target=event.target;if(target.id==='feedback-text'&&run){run.feedbackText=target.value.slice(0,2000);document.getElementById('feedback-count').textContent=run.feedbackText.length+' / 2000';saveRun();return}handleEditorInput(target)});
app.addEventListener('change',async event=>{const target=event.target;if(target.id==='consent'){state.consent=target.checked;app.querySelector('[data-action="enter-quiz"]').disabled=!state.zodiac||!state.consent;return}if((target.dataset.editorRoute||target.id==='config-file'||target.dataset.edit)&&!window.XinjiAdmin?.isUnlocked())return;if(target.dataset.editorRoute){state.editor[target.dataset.editorRoute]=target.value;state.editor.position=0;render();return}if(target.id==='config-file'){const file=target.files&&target.files[0];if(!file)return;if(file.size>LIMIT){editorStatus('导入失败：JSON 文件超过 1.9 MB，现有题库未被修改。',true);target.value='';return}try{const content=await file.text();if(!window.XinjiAdmin?.isUnlocked()||!state.editor)return;const imported=JSON.parse(content.replace(/^\uFEFF/,'')),validation=checked(imported);if(!validation.success){editorStatus('导入失败，现有题库未被修改：\n'+validation.errors.join('\n'),true);return}state.editor.draft=validation.data;state.editor.position=0;state.editor.dirty=true;state.editor.status='已验证并载入 24 套、1200 题到编辑草稿。请点击“验证并保存到本机”应用，或直接导出新的 HTML。';state.editor.statusError=false;render()}catch(_){editorStatus('导入失败：请使用本测试导出的有效 JSON 题库文件，现有题库未被修改。',true)}finally{target.value=''}return}if(target.tagName==='SELECT')handleEditorInput(target)});
document.addEventListener('keydown',event=>{if(app.querySelector('dialog[open]')||['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)||event.altKey||event.ctrlKey||event.metaKey)return;if(state.view==='quiz'&&/^[1-4]$/.test(event.key)){event.preventDefault();answer(Number(event.key)-1)}});
render();
window.XinjiAdmin.configure({onUnlock:()=>openEditor(),onLock:()=>{if(state.view==='editor'){const prior=state.editor?.returnView||'home';state.editor=null;navigate(prior)}}});
})();
</script>
</body>
